version: "2"

run:
  go: "1.27"
  tests: true
  allow-parallel-runners: true

linters:
  default: none
  enable:
    - errcheck
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment
  exclusions:
    rules:
      - linters:
          - errcheck
          - gocyclo
          - gosec
        path: _test\.go
      - linters:
          - revive
        text: "exported:.*should have comment"
      - linters:
          - revive
        text: "package-comments: should have a package comment"
    paths:
      - internal/link/usecase/mocks
