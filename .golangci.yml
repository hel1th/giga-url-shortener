version: "2"

run:
  go: "1.27"
  timeout: 5m
  tests: true
  allow-parallel-runners: true
  skip-dirs:
    - internal/link/usecase/mocks

linters-settings:
  govet:
    enable-all: true
    disable:
      - shadow
  errcheck:
    check-type-assertions: false
    check-blank: false

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - revive
    - gocyclo

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - gosec

    # Полностью скрываем раздражающие ворнинги про отсутствие комментариев (revive/exported)
    - linters:
        - revive
      text: "exported:.*should have comment"

    # Также скрываем предупреждения revive об именовании параметров "unused-parameter" (если переменная действительно не юзается, об этом и так скажет `unused` или `ineffassign`)
    # - linters:
    #    - revive
    #  text: "unused-parameter:"
