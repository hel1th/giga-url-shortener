<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giga URL Shortener</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --primary: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #4ade80;
            --error: #f87171;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 680px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.5;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: var(--primary);
        }
        .subtitle {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }
        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 1.15rem;
            margin-top: 0;
            margin-bottom: 12px;
        }
        .form-group {
            display: flex;
            gap: 8px;
        }
        input[type="text"], input[type="url"] {
            flex: 1;
            padding: 10px 14px;
            background-color: #0b1120;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
        }
        input:focus {
            border-color: var(--primary);
        }
        button {
            background-color: var(--primary);
            color: #0b1120;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            padding: 10px 18px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .result {
            margin-top: 14px;
            padding: 12px;
            border-radius: 6px;
            background: #0b1120;
            border: 1px solid var(--border);
            display: none;
            word-break: break-all;
        }
        .result a {
            color: var(--success);
            font-weight: 600;
            text-decoration: underline;
        }
        pre {
            background: #0b1120;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            overflow-x: auto;
            font-size: 0.85rem;
            color: #38bdf8;
            margin-top: 12px;
            display: none;
        }
        .links {
            display: flex;
            gap: 12px;
            font-size: 0.85rem;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .links a {
            color: var(--text-muted);
            text-decoration: none;
        }
        .links a:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <h1>🚀 Giga URL Shortener</h1>
    <div class="subtitle">Распределенный сокращатель ссылок с потоковой аналитикой в ClickHouse</div>

    <!-- Блок 1: Сокращение ссылок -->
    <div class="card">
        <h2>1. Сократить ссылку</h2>
        <div class="form-group">
            <input type="url" id="originalUrl" placeholder="https://example.com/very/long/url" value="https://habr.com/ru/articles/700000/">
            <button onclick="shortenLink()">Сократить</button>
        </div>
        <div id="shortenResult" class="result"></div>
    </div>

    <!-- Блок 2: Получение статистики -->
    <div class="card">
        <h2>2. Получить аналитику по ссылке (OLAP)</h2>
        <div class="form-group">
            <input type="text" id="statsCode" placeholder="Код ссылки (например: x7K9a8B)">
            <button onclick="getStats()">Показать статистику</button>
        </div>
        <pre id="statsResult"></pre>
    </div>

    <!-- Навигация по сервисам -->
    <div class="links">
        <a href="/metrics" target="_blank">📊 Prometheus Metrics (/metrics)</a>
        <a href="/healthz" target="_blank">💚 Healthcheck (/healthz)</a>
        <a href="http://localhost:16686" target="_blank">🔍 Jaeger UI</a>
        <a href="http://localhost:9090" target="_blank">📈 Prometheus UI</a>
    </div>

    <script>
        async function shortenLink() {
            const urlInput = document.getElementById('originalUrl').value.trim();
            const resDiv = document.getElementById('shortenResult');
            if (!urlInput) return alert('Введите URL');

            resDiv.style.display = 'block';
            resDiv.innerHTML = 'Создаем...';

            try {
                const res = await fetch('/api/v1/links', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ original_url: urlInput })
                });

                const data = await res.json();
                if (!res.ok) {
                    resDiv.style.color = 'var(--error)';
                    resDiv.innerText = 'Ошибка: ' + (data.message || JSON.stringify(data));
                    return;
                }

                resDiv.style.color = 'var(--text)';
                resDiv.innerHTML = `Готово! Короткая ссылка (кликни для перехода):<br>` +
                    `<a href="${data.short_url}" target="_blank">${data.short_url}</a> ` +
                    `<span style="color:var(--text-muted); font-size:0.85rem"> (Код: <b>${data.short_code}</b>)</span>`;

                document.getElementById('statsCode').value = data.short_code;
            } catch (err) {
                resDiv.style.color = 'var(--error)';
                resDiv.innerText = 'Сетевая ошибка: ' + err.message;
            }
        }

        async function getStats() {
            const code = document.getElementById('statsCode').value.trim();
            const pre = document.getElementById('statsResult');
            if (!code) return alert('Введите короткий код');

            pre.style.display = 'block';
            pre.innerText = 'Запрашиваем ClickHouse через gRPC...';

            try {
                const res = await fetch(`/api/v1/links/${code}/stats`);
                const data = await res.json();
                pre.innerText = JSON.stringify(data, null, 2);
            } catch (err) {
                pre.innerText = 'Ошибка: ' + err.message;
            }
        }
    </script>
</body>
</html>
